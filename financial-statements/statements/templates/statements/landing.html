{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Financial Statement Flow Tool</title>
<style>
  :root{
    --royal:#2b46e0;
  }
  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{
    margin:0;
    font-family:'Segoe UI',Arial,sans-serif;
    background:
      radial-gradient(circle at 0% 0%, #2a1210 0%, transparent 45%),
      linear-gradient(135deg, #1c1330 0%, #202a6e 45%, #2b46e0 100%);
    color:#fff;
    min-height:100vh;
    display:flex;
    align-items:center;
  }
  .stage{
    width:100%;
    max-width:1100px;
    margin:0 auto;
    padding:0 48px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:32px;
  }
  h1{
    font-size:clamp(34px, 5vw, 52px);
    font-weight:800;
    line-height:1.12;
    margin:0;
    max-width:420px;
    letter-spacing:-0.5px;
  }
  .cta{
    flex-shrink:0;
    display:inline-flex;
    align-items:center;
    justify-content:center;
    padding:18px 34px;
    border-radius:999px;
    background:rgba(255,255,255,0.12);
    border:1px solid rgba(255,255,255,0.18);
    color:#dfe3ff;
    font-size:17px;
    font-weight:600;
    text-decoration:none;
    backdrop-filter:blur(2px);
    transition:background 0.15s ease, color 0.15s ease;
  }
  .cta:hover{
    background:rgba(255,255,255,0.22);
    color:#fff;
  }
  @media (max-width: 640px){
    .stage{flex-direction:column;align-items:flex-start;padding:0 28px;}
    h1{max-width:none;}
  }
</style>
</head>
<body>
  <div class="stage">
    <h1>Map How The Financial Statements Link.</h1>
    <a class="cta" href="{% url 'statements:workspace' %}">Get Started</a>
  </div>
</body>
</html>
